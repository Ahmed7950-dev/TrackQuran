    <script>
      // Inline in `head` so the page never flashes the wrong theme. Mirrors
      // applyTheme() in utils/theme.ts — change both together.
      // `amber` is the dark theme with its own overrides on top, so it carries
      // BOTH the class and the attribute.
      const savedTheme = localStorage.getItem('theme');
      const root = document.documentElement;
      root.classList.remove('dark');
      root.removeAttribute('data-theme');
      if (savedTheme === 'dark' || savedTheme === 'amber') root.classList.add('dark');
      if (savedTheme === 'reading') root.setAttribute('data-theme', 'reading');
      if (savedTheme === 'amber') root.setAttribute('data-theme', 'amber');
      if (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        root.classList.add('dark');
      }
      // Set language and direction
      const lang = localStorage.getItem('language') || 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      // Initialize font preference
      let savedFont = localStorage.getItem('quranicFont') || 'Hafs';
      if (savedFont === 'Husrev') savedFont = 'Hafs'; // removed font — fall back
      document.documentElement.style.setProperty('--quranic-font', savedFont);
    </script>

    <style>
      /* Prevent stray horizontal overflow on mobile (keeps every page within the
         viewport). `clip` doesn't create a scroll container, so sticky headers
         still work; intentional horizontal scrollers use their own overflow-x. */
      html, body {
        max-width: 100%;
        overflow-x: clip;
      }
      body {
        /* This will be overridden by tailwind classes */
        background-color: #f0f4f8;
        font-family: 'Inter', sans-serif;
      }
      .dark body {
        background-color: #111827; /* Corresponds to gray-900 */
      }
      [data-theme="reading"] body {
        background-color: #faf8f3; /* Warm cream background for reading mode */
      }
      /* Reading mode color overrides */
      [data-theme="reading"] .bg-slate-100,
      [data-theme="reading"] .bg-white {
        background-color: #f5f1e8 !important; /* Warm cream for cards/panels */
      }
      [data-theme="reading"] .bg-gray-800,

      }

        color: #3d3528 !important; /* Warm dark brown for primary text */
      }
      [data-theme="reading"] .text-slate-600 {
        color: #5a5142 !important; /* Medium brown */
      }
      [data-theme="reading"] .text-slate-500 {
        color: #7a7060 !important; /* Lighter brown for secondary text */
      }
      [data-theme="reading"] .text-slate-400,
      [data-theme="reading"] .text-slate-300,
      [data-theme="reading"] .text-slate-200 {
        color: #9a9080 !important; /* Light brown for muted text */
      }

      }

      }
      [data-theme="reading"] .bg-gray-600 {
        background-color: #ddd4c4 !important;

      /* ── Amber: the dark theme with the blue taken out ────────────────────
         It keeps the `dark` class, so every `dark:` class in the app still
         fires and only the greys and the accent are restated here. Tailwind's
         grey scale is blue-tinted (#111827, #1F2937 …), which is the navy cast
         the dark theme has; these are the neutral equivalents.
      ── ────────────────────────────────────────────────────────────────── */
      html.dark[data-theme="amber"] body { background-color: #0D0E10; }
      html.dark[data-theme="amber"] .bg-gray-900 { background-color: #0D0E10 !important; }
      html.dark[data-theme="amber"] .bg-gray-800 { background-color: #16181A !important; }
      html.dark[data-theme="amber"] .bg-gray-700 { background-color: #1D2023 !important; }
      html.dark[data-theme="amber"] .bg-gray-600 { background-color: #2A2D31 !important; }
      html.dark[data-theme="amber"] .hover\:bg-gray-800:hover { background-color: #1A1C1F !important; }
      html.dark[data-theme="amber"] .hover\:bg-gray-700:hover { background-color: #22262A !important; }
      html.dark[data-theme="amber"] .hover\:bg-gray-600:hover { background-color: #2E3236 !important; }
      html.dark[data-theme="amber"] .border-gray-700 { border-color: #2A2D31 !important; }
      html.dark[data-theme="amber"] .border-gray-600 { border-color: #343840 !important; }
      html.dark[data-theme="amber"] .text-slate-100 { color: #F2F4F6 !important; }
      html.dark[data-theme="amber"] .text-slate-200 { color: #E7EAED !important; }
      html.dark[data-theme="amber"] .text-slate-300 { color: #C9CDD2 !important; }
      html.dark[data-theme="amber"] .text-slate-400 { color: #9BA1A8 !important; }
      html.dark[data-theme="amber"] .text-slate-500 { color: #929AA1 !important; }
      /* The accent warms from the dark theme's red-orange to the booth's gold,
         which is the "orange" half of black-and-orange. */
      html.dark[data-theme="amber"] .text-orange-400,
      html.dark[data-theme="amber"] .text-orange-500 { color: #E8A33D !important; }
      html.dark[data-theme="amber"] .border-orange-500 { border-color: #E8A33D !important; }
      html.dark[data-theme="amber"] .bg-orange-600 { background-color: #C77B14 !important; }
      html.dark[data-theme="amber"] input,
      html.dark[data-theme="amber"] textarea,
      html.dark[data-theme="amber"] select { background-color: #1A1C1F; color: #F2F4F6; }

      /* ── The Media tab's palette ──────────────────────────────────────────
         The booth paints from these rather than from Tailwind colours, so it
         follows the site's three modes instead of being dark for ever.

         The accent and the "watched" green go DARKER on a light ground rather
         than keeping their night values: #E8A33D as text on cream is about
         2:1, which is unreadable. Hue stays, lightness moves.

         `--m-screen` is the one thing that does not change: a video frame is
         black in every mode, because it is a screen.
      ── ────────────────────────────────────────────────────────────────── */
      .media-booth {
        --m-ground: #F1F4F7;
        --m-thumb-dim: 0.88;
        --m-panel:  #FFFFFF;
        --m-card:   #FFFFFF;
        --m-raised: #F6F8FA;
        --m-line:   #E2E8EE;
        --m-edge:   #CBD4DD;
        --m-ink:    #14181C;
        --m-body:   #3A444E;
        --m-muted:  #5B6773;
        --m-dim:    #606B77;
        --m-accent: #94570A;
        --m-on-accent: #FFFFFF;
        --m-chip:   #FAF0DD;
        --m-good:   #1E7F4C;
        --m-good-fill: #1A7245;
        --m-good-on:   #FFFFFF;
        --m-good-line: #9FD3B6;
        --m-good-bg:   #E8F5EE;
        --m-track:  #DCE3E9;
        --m-well:   #E6EBF0;
        --m-well-fg:#3A444E;
        --m-screen: #000000;
        --m-warn-bg:   #FDF3E2;
        --m-warn-line: #E3C68A;
        --m-warn-ink:  #6B4A12;
        --m-bad-bg:   #FDECEC;
        --m-bad-line: #E8B4B4;
        --m-bad-ink:  #8C2F2F;
      }
      /* Plain dark: the booth wears the site's own night rather than its own.
         Straight off Tailwind's grey scale and the dark theme's orange, so the
         tab does not look like a different product inside the same window. */
      .dark .media-booth {
        --m-ground: #111827;
        --m-panel:  #1F2937;
        --m-card:   #1F2937;
        --m-raised: #374151;
        --m-line:   #374151;
        --m-edge:   #4B5563;
        --m-ink:    #F1F5F9;

        --m-muted:  #A6B2C2;
        --m-dim:    #AAB6C6;
        --m-accent: #F97316;
        --m-on-accent: #1A1206;
        --m-chip:   #3A2410;
        --m-good:   #4ADE80;
        --m-good-fill: #15803D;
        --m-good-on:   #ECFDF5;
        --m-good-line: #2F6B47;

        --m-warn-line: #553F1A;
        --m-warn-ink:  #FCD9A0;
        --m-bad-bg:   #2E1A1A;
        --m-bad-line: #6B2E2E;
        --m-bad-ink:  #F5C2C2;
      }
      html.dark[data-theme="amber"] .media-booth {
        --m-ground: #121315;
        --m-thumb-dim: 0.46;
        --m-panel:  #16181A;
        --m-card:   #1A1C1F;
        --m-raised: #1D2023;
        --m-line:   #2A2D31;

      [data-theme="reading"] .media-booth input,
      [data-theme="reading"] .media-booth textarea,
      [data-theme="reading"] .media-booth select {
        background-color: var(--m-card) !important;
        color: var(--m-ink) !important;

       html[lang="ar"] body {
        font-family: 'Hafs', 'Cairo', sans-serif;

      /* ── Quranic / Arabic script fonts ────────────────────────────────────
         font-display: block  →  browser waits (text invisible) rather than
         showing the system fallback. System Arabic fonts have no Quranic
         ligatures, so they render letters disconnected. Invisible-then-correct
         is vastly better than immediately-wrong on Safari and slow connections.
         The preload hint above ensures Hafs downloads before the block period
         expires on any reasonable connection.
      ── ────────────────────────────────────────────────────────────────── */
      /* Shaikh Hamdullah Mushaf — Turkish (Istanbul) style. Rendered with its
         own TEXT source (public/quran-tr, Ali al-Qari rasm), not the Uthmani
         API text. */
      @font-face {
        font-family: 'Hamdullah';
        src: url('/Fonts/Hamdullah.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Hafs';
        src: url('/Fonts/Hafs.ttf?v=3') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
        unicode-range: U+0600-U+06FF, U+0750-U+077F, U+08A0-U+08FF,
                       U+FB50-U+FDFF, U+FE70-U+FEFF, U+0020-U+002F;
      }
      @font-face {
        font-family: 'KFGQPC Uthmanic Script HAFS';
        src: url('/Fonts/KFGQPC%20Uthmanic%20Script%20HAFS.otf') format('opentype');

        font-style: normal;
        font-display: block;
        unicode-range: U+0600-U+06FF, U+0750-U+077F, U+08A0-U+08FF,

      }
